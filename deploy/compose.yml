# 幻想乡生产栈。**本地开发不用这个文件**——dev 依赖走原生进程，
# 见 ../scripts/dev-services.sh。
#
#   cd ~/th && docker compose -f deploy/compose.yml up -d --build
#
# 有状态服务绝不用 :latest；postgres/redis 固定大版本，
# Meilisearch 固定次版本（跨次版本升级需要迁移数据库，浮动 tag 会启动失败）。
name: gensokyo

x-app-env: &app-env
  DATABASE_URL: postgres://gensokyo:${POSTGRES_PASSWORD}@postgres:5432/gensokyo
  REDIS_URL: redis://redis:6379/0
  MEILI_HOST: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${PUBLIC_URL}
  TRUSTED_ORIGINS: ${PUBLIC_URL}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET}
  # 对外读取的基地址：经 Caddy 的 /img 反代，不直接暴露 MinIO
  S3_PUBLIC_BASE_URL: ${PUBLIC_URL}/img/${S3_BUCKET}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gensokyo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gensokyo
    # postgres:18 起改了约定：挂 /var/lib/postgresql（镜像自己在里面按
    # 大版本建子目录），而不是老的 /var/lib/postgresql/data。
    # 挂错的话容器会拒绝启动并提示 pg_upgrade——这也是它替你挡住的一次误配。
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gensokyo -d gensokyo']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.53
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes: [meilidata:/meili_data]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # 建桶并开匿名只读。图片本来就是公开内容，读走 Caddy 的 /img；
  # 写永远经 api 代理（见 apps/api/src/storage.ts 的说明）。
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      sh -c "
      mc alias set gs http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing gs/${S3_BUCKET} &&
      mc anonymous set download gs/${S3_BUCKET}
      "
    restart: 'no'

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    depends_on:
      postgres: {condition: service_healthy}
    environment: *app-env
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      meilisearch: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment: *app-env
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        # 只要主机名，不含协议——CSRF 检查比的是 host
        ALLOWED_ACTION_ORIGINS: ${PUBLIC_HOST}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    environment:
      NODE_ENV: production
      # SSR 侧走内网直连；浏览器侧是同源相对路径，由 Caddy 分流
      API_URL: http://api:3001

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api, minio]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports: ['${HTTP_PORT}:80']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
  caddydata:
  caddyconfig:
